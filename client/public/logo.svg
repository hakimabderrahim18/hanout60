<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <g>
    <!-- Text: hanout -->
    <text x="10" y="82" font-family="'Cairo', 'Poppins', 'Segoe UI', system-ui, sans-serif" font-size="80" font-weight="900" fill="#7c3aed" letter-spacing="-2">
